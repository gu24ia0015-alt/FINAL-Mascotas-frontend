<div class="contenedor">
  <div class="encabezado">
    <h2>Productos</h2>
    <app-boton texto="+ Nuevo Producto" tipo="primario" (clickBoton)="nuevoProducto()"></app-boton>
  </div>

  <p *ngIf="cargando()">Cargando productos...</p>
  <p *ngIf="error()" class="mensaje-error">{{ error() }}</p>

  <app-tabla
    *ngIf="!cargando() && !error()"
    [columnas]="columnas"
    [datos]="productos()"
    (editar)="editarProducto($event)"
    (eliminar)="eliminarProducto($event)">
  </app-tabla>
</div>
