<div class="contenedor">
  <div class="encabezado">
    <h2>Clientes</h2>
    <app-boton texto="+ Nuevo Cliente" tipo="primario" (clickBoton)="nuevoCliente()"></app-boton>
  </div>

  <p *ngIf="cargando()">Cargando clientes...</p>
  <p *ngIf="error()" class="mensaje-error">{{ error() }}</p>

  <app-tabla
    *ngIf="!cargando() && !error()"
    [columnas]="columnas"
    [datos]="clientes()"
    (editar)="editarCliente($event)"
    (eliminar)="eliminarCliente($event)">
  </app-tabla>
</div>
