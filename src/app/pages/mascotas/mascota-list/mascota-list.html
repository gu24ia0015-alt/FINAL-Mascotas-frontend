<div class="contenedor">
  <div class="encabezado">
    <h2>Mascotas</h2>
    <app-boton texto="+ Nueva Mascota" tipo="primario" (clickBoton)="nuevaMascota()"></app-boton>
  </div>

  <p *ngIf="cargando()">Cargando mascotas...</p>
  <p *ngIf="error()" class="mensaje-error">{{ error() }}</p>

  <app-tabla
    *ngIf="!cargando() && !error()"
    [columnas]="columnas"
    [datos]="mascotas()"
    (editar)="editarMascota($event)"
    (eliminar)="eliminarMascota($event)">
  </app-tabla>
</div>
