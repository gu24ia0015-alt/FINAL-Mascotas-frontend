<div class="contenedor">
  <div class="encabezado">
    <h2>Citas</h2>
    <app-boton texto="+ Nueva Cita" tipo="primario" (clickBoton)="nuevaCita()"></app-boton>
  </div>

  <p *ngIf="cargando()">Cargando citas...</p>
  <p *ngIf="error()" class="mensaje-error">{{ error() }}</p>

  <app-tabla
    *ngIf="!cargando() && !error()"
    [columnas]="columnas"
    [datos]="citas()"
    (editar)="editarCita($event)"
    (eliminar)="eliminarCita($event)">
  </app-tabla>
</div>
