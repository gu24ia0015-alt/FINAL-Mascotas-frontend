<div class="contenedor">
  <div class="encabezado">
    <h2>Pedidos</h2>
    <app-boton texto="+ Nuevo Pedido" tipo="primario" (clickBoton)="nuevoPedido()"></app-boton>
  </div>

  <p *ngIf="cargando()">Cargando pedidos...</p>
  <p *ngIf="error()" class="mensaje-error">{{ error() }}</p>

  <app-tabla
    *ngIf="!cargando() && !error()"
    [columnas]="columnas"
    [datos]="pedidos()"
    (editar)="editarPedido($event)"
    (eliminar)="eliminarPedido($event)">
  </app-tabla>
</div>
